# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: noospherehub
services:
  noosphere-hub:
    image: ghcr.io/hpp-io/noosphere-hub:demo
    container_name: noosphere-hub
    environment:
      - _JAVA_OPTIONS=-Xmx512m -Xms256m
      - SPRING_PROFILES_ACTIVE=development,api-docs
      - MANAGEMENT_PROMETHEUS_METRICS_EXPORT_ENABLED=true
      - SPRING_CLOUD_CONSUL_HOST=noosphere-consul
      - SPRING_CLOUD_CONSUL_PORT=8500
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}
      - SPRING_DATASOURCE_URL=jdbc:mysql://noosphere-mysql:3306/nshub?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&createDatabaseIfNotExist=true
      - SPRING_LIQUIBASE_URL=jdbc:mysql://noosphere-mysql:3306/nshub?useUnicode=true&characterEncoding=utf8&useSSL=false&useLegacyDatetimeCode=false&createDatabaseIfNotExist=true
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_OIDC_ISSUER_URI=http://noosphere-auth:9080/realms/noosphere
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_OIDC_CLIENT_SECRET=${HPP_AUTH_WEB_APP_SECRET}
      - SPRING_PULSAR_CLIENT_SERVICE_URL=pulsar://noosphere-pulsar:6650
      - SPRING_PULSAR_ADMINISTRATION_SERVICE_URL=http://noosphere-pulsar:9082
      - APPLICATION_KEYCLOAK_ADMIN_CLIENT_SECRET=${HPP_AUTH_ADMIN_CLI_SECRET}
      - APPLICATION_KEYSTORE_STORE_PASSWORD=${HPP_KEYSTORE_PASSWORD}
      - APPLICATION_KEYSTORE_PATH=/app/hpp-keystore.p12
      - APPLICATION_KEYSTORE_KEYS_ETH=${HPP_ETH_KEY_ALIAS}
      - APPLICATION_BLOCKCHAIN_ROUTER_ADDRESS=${HPP_ROUTER_ADDRESS}
    volumes:
      - ../../../hpp-keystore.p12:/app/hpp-keystore.p12
    ports:
      - 8085:8085
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8085/management/health
      interval: 5s
      timeout: 5s
      retries: 40
  #    depends_on:
  #      mysql:
  #        condition: service_healthy
  #      keycloak:
  #        condition: service_healthy
  noosphere-mysql:
    extends:
      file: ./mysql.yml
      service: noosphere-mysql
  noosphere-auth:
    extends:
      file: ./keycloak.yml
      service: noosphere-auth
  noosphere-pulsar:
    extends:
      file: ./pulsar.yml
      service: noosphere-pulsar
  noosphere-consul:
    extends:
      file: ./consul.yml
      service: noosphere-consul
  noosphere-consul-config-loader:
    extends:
      file: ./consul.yml
      service: noosphere-consul-config-loader
