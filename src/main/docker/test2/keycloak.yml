  nginx-proxy:
    image: nginx:latest
    container_name: nginx-proxy
    volumes:
      # Mount the config file you just created
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      # This IS exposed. This is what cloudflared will talk to.
      - '9898:80'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
