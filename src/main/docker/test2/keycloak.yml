# This configuration is intended for development purpose, it's **your** responsibility to harden it for production
name: noospherehub
services:
  noosphere-auth:
    container_name: noosphere-auth
    image: ghcr.io/hpp-io/noosphere-auth:test2-amd64
    command: 'start'
    volumes:
      - ../realm-config:/opt/keycloak/data/import
      - ../realm-config/keycloak-health-check.sh:/opt/keycloak/health-check.sh
    environment:
      - KC_DB_URL_HOST=noosphere-mysql
      - KC_DB_URL_PORT=3306
      - KC_DB_USERNAME=${DATABASE_USERNAME}
      - KC_DB_PASSWORD=${DATABASE_PASSWORD}
      - KC_DB=mysql
      - KC_PROXY=passthrough
      - KC_HOSTNAME=authtest.hpp.io
      - KC_HOSTNAME_URL=https://authtest.hpp.io
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      - KC_FEATURES=scripts
      - KC_HTTP_PORT=9080
      #      - KC_HTTPS_PORT=9443
      - KC_HEALTH_ENABLED=true
      - KC_HTTP_ENABLED=true
      - KC_HTTP_MANAGEMENT_PORT=9990
      - KC_HOSTNAME_STRICT=true
      - KC_HOSTNAME_STRICT_HTTPS=true
      - JDBC_PARAMS='useUnicode=true&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=Asia/Seoul&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true'
      #      - PROXY_ADDRESS_FORWARDING=true
      - JAVA_OPTS='-Djava.net.preferIPv4Stack=true -Xms1G -Xmx3G -XX:MetaspaceSize=512M -XX:MaxMetaspaceSize=1G'
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 7080:9080
      - 7990:9990
      - 7443:9443
    healthcheck:
      test: 'bash /opt/keycloak/health-check.sh'
      interval: 5s
      timeout: 5s
      # Increased retries due to slow Keycloak startup in GitHub Actions using MacOS
      retries: 50
      start_period: 10s
    labels:
      org.springframework.boot.ignore: true

