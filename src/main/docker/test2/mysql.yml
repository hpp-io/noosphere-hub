name: noospherehub
services:
  noosphere-mysql:
    container_name: noosphere-mysql
    image: mysql:9.2.0
    volumes:
      - ../config/mysql:/etc/mysql/conf.d
      - ../db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=no
      - MYSQL_USER=${DATABASE_USERNAME}
      - MYSQL_PASSWORD=${DATABASE_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${DATABASE_ROOT_PASSWORD}
    #      - MYSQL_DATABASE=keycloak
    # If you want to expose these ports outside your dev PC,
    # remove the "127.0.0.1:" prefix
    ports:
      - 3356:3306
    command: mysqld --lower_case_table_names=1 --max_connections=1000 --max-allowed-packet=64M --skip-mysqlx --character_set_server=utf8mb4 --explicit_defaults_for_timestamp --collation_server=utf8mb4_general_ci
    healthcheck:
      test: ['CMD-SHELL', 'mysql -e "SHOW DATABASES;" && sleep 5']
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  mysql-data:
