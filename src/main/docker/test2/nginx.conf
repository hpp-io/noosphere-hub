events { worker_connections 1024; }

http {
    sub_filter 'http://$host' 'https://$host';
    sub_filter_once off;

    server {
            listen 80;
            server_name authtest.hpp.io; # The hostname you are using

            location / {
                resolver 127.0.0.11;
                set $upstream_auth http://noosphere-auth:9080;
                proxy_pass $upstream_auth;

                # Set correct headers for Keycloak
                proxy_headers_hash_max_size 512;
                proxy_headers_hash_bucket_size 128;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

                # We will NOT pass X-Forwarded-Proto, as we know Keycloak ignores it.
            }
        }
    server {
            listen 80;
            server_name nstest.hpp.io; # The hostname you are using

            location / {
                resolver 127.0.0.11;
                set $upstream_gateway http://noosphere-gateway:8280;
                proxy_pass $upstream_gateway;

                # Set correct headers for Keycloak
                proxy_headers_hash_max_size 512;
                proxy_headers_hash_bucket_size 128;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

                # We will NOT pass X-Forwarded-Proto, as we know Keycloak ignores it.
            }
        }
}